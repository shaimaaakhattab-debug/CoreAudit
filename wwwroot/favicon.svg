<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Core Audit">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2a4a"/>
      <stop offset="1" stop-color="#14223f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ddc08c"/>
      <stop offset="0.55" stop-color="#c9a86a"/>
      <stop offset="1" stop-color="#b89150"/>
    </linearGradient>
  </defs>
  <!-- Navy rounded tile -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#g)"/>
  <!-- Thin gold inner frame -->
  <rect x="5.5" y="5.5" width="53" height="53" rx="11" fill="none" stroke="url(#gold)" stroke-width="1.6" opacity="0.6"/>
  <!-- CA monogram -->
  <text x="32" y="33" text-anchor="middle" dominant-baseline="central"
        font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="30"
        letter-spacing="-1" fill="url(#gold)">CA</text>
  <!-- Gold underline accent -->
  <rect x="21" y="46" width="22" height="3" rx="1.5" fill="url(#gold)"/>
</svg>
