name: Build and Deploy CoreAudit

# Production branch is "main" (verified default + only branch on origin).
#
# TEMPORARY: the automatic push trigger is DISABLED while the SmarterASP Web
# Deploy fix is validated. Deployment runs only when started manually from the
# Actions tab (workflow_dispatch). Re-enable the push trigger (see the commented
# block below) after a successful manual deploy has been confirmed on the live site.
on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main

permissions:
  contents: read

concurrency:
  # Never let two deploys to the same site run at once.
  group: deploy-production
  cancel-in-progress: false

env:
  PROJECT: CoreAudit.csproj
  TEST_PROJECT: CoreAudit.Tests/CoreAudit.Tests.csproj
  PUBLISH_DIR: publish

jobs:
  build-test-deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore "${{ env.PROJECT }}"

      - name: Build (Release)
        run: dotnet build "${{ env.PROJECT }}" --configuration Release --no-restore

      - name: Test
        # Runs the xUnit suite in CoreAudit.Tests. Tests use mocked HTTP and never
        # send real email, so this is safe in CI.
        run: dotnet test "${{ env.TEST_PROJECT }}" --configuration Release

      - name: Publish
        run: dotnet publish "${{ env.PROJECT }}" --configuration Release --no-build --output "${{ env.PUBLISH_DIR }}"

      - name: Deploy to SmarterASP.NET (Web Deploy, contentPath only)
        shell: pwsh
        env:
          # Credentials come only from GitHub Secrets; never hardcoded or printed.
          WEBSITE_NAME: ${{ secrets.WEBSITE_NAME }}
          SERVER_COMPUTER_NAME: ${{ secrets.SERVER_COMPUTER_NAME }}
          SERVER_USERNAME: ${{ secrets.SERVER_USERNAME }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          # 1) Locate msdeploy.exe rather than assuming a single path. The GitHub
          #    windows-latest image ships Web Deploy, but the exact location varies
          #    between the standalone IIS install and the Visual Studio component.
          $candidates = @(
            "C:\Program Files (x86)\IIS\Microsoft Web Deploy V3\msdeploy.exe",
            "C:\Program Files\IIS\Microsoft Web Deploy V3\msdeploy.exe",
            "C:\Program Files (x86)\IIS\Microsoft Web Deploy V2\msdeploy.exe"
          )
          $msdeploy = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $msdeploy) {
            $found = Get-ChildItem -Path 'C:\Program Files','C:\Program Files (x86)' -Recurse -Filter 'msdeploy.exe' -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
            if ($found) { $msdeploy = $found }
          }
          if (-not $msdeploy) { throw "msdeploy.exe was not found on the runner." }
          Write-Host "Using msdeploy: $msdeploy"

          # 2) Build the destination computerName. SERVER_COMPUTER_NAME is expected
          #    to be the bare endpoint (e.g. https://host:8172). Only append the
          #    MsDeploy handler + site when it is not already present, so a secret
          #    that already includes /MsDeploy.axd is NOT duplicated.
          $computer = $env:SERVER_COMPUTER_NAME
          if ($computer -match 'MsDeploy\.axd') {
            $computerArg = $computer
          } else {
            $computerArg = "$($computer.TrimEnd('/'))/MsDeploy.axd?site=$($env:WEBSITE_NAME)"
          }

          $sourcePath = Join-Path $env:GITHUB_WORKSPACE $env:PUBLISH_DIR

          # 3) contentPath-only sync — the provider SmarterASP authorises for
          #    customer accounts. No recycleApp / app-pool operation (that is what
          #    caused the 401). DoNotDeleteRule => never removes remote files.
          #    Skip App_Data so stored contact submissions are untouched.
          $deployArgs = @(
            "-verb:sync",
            "-source:contentPath=$sourcePath",
            "-dest:contentPath=$($env:WEBSITE_NAME),computerName=$computerArg,userName=$($env:SERVER_USERNAME),password=$($env:SERVER_PASSWORD),authType=Basic",
            "-allowUntrusted",
            "-enableRule:DoNotDeleteRule",
            "-skip:Directory=App_Data"
          )

          & $msdeploy @deployArgs
          if ($LASTEXITCODE -ne 0) { throw "Web Deploy failed with exit code $LASTEXITCODE." }
          Write-Host "Deployment completed with exit code 0."
